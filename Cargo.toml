[package]
name = "pifrost"
version = "0.2.0"
description = "SSH-based Ubuntu Server provisioner — zero-log, no-FS-bloat, RKE2"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dialoguer = "0.11"
colored = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
