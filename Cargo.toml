[package]
name = "pifrost"
version = "0.1.0"
description = "Pure Rust + Packer Cross-Platform Immutable K8s Node Provisioner"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
colored = "2"
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }
dialoguer = "0.11"
hex = "0.4"
regex = "1"
